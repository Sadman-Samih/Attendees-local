<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Attendance tracker – mark and manage attendance records">
  <meta name="theme-color" content="#2b6cb0">

  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <title>Attendees</title>
</head>
<body>

<div class="container">

  <div class="sheet-header">
    <h1 id="sheet-title">Attendance Sheet</h1>

    <div class="selectors">
      <div class="select-group">
        <label for="month-select">Month</label>
        <select id="month-select">
          <option value="0">January</option>
          <option value="1">February</option>
          <option value="2">March</option>
          <option value="3">April</option>
          <option value="4">May</option>
          <option value="5">June</option>
          <option value="6">July</option>
          <option value="7">August</option>
          <option value="8">September</option>
          <option value="9">October</option>
          <option value="10">November</option>
          <option value="11">December</option>
        </select>
      </div>

      <div class="select-group">
        <label for="year-select">Year</label>
        <select id="year-select">
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
          <option value="2029">2029</option>
          <option value="2030">2030</option>
          <option value="2031">2031</option>
          <option value="2032">2032</option>
          <option value="2033">2033</option>
          <option value="2034">2034</option>
          <option value="2035">2035</option>
          <option value="2036">2036</option>
          <option value="2037">2037</option>
          <option value="2038">2038</option>
          <option value="2039">2039</option>
          <option value="2040">2040</option>
        </select>
      </div>
    </div> </div>
  <div id="app-status" class="app-status" role="status" aria-live="polite" hidden></div>
  <div class="table-wrap">
  <table id="sheet-table">
    <thead id="table-head"></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

</div>

<footer style="text-align:center;padding:16px 0 4px;font-size:13px;color:#888;">
  Attendance Tracker
</footer>

<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
